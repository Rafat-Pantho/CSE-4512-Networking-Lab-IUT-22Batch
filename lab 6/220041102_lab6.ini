[General]
sim-time-limit = 15s

[Config FiveLabsTask]
network = FiveLabs

**.cli.reqLength = 500B
**.cli.respLength = 500B

**.cli.sendInterval = exponential(1s)

**.lab1hostA.cli.destAddress = "lab2hostA"
**.lab2hostA.cli.destAddress = "lab3hostA"
**.lab3hostA.cli.destAddress = "lab4hostA"
**.lab4hostA.cli.destAddress = "lab5hostA"
**.lab5hostA.cli.destAddress = "lab1hostA"
**.lab*hostB.cli.destAddress = ""